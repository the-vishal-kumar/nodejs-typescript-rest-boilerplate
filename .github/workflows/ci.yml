name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prettier
        run: npm run pretty:check

      - name: ESLint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # e2e suites drive the app in-process (supertest) against the Mongo
      # service, so coverage includes routes, controllers and models.
      - name: Unit and e2e tests with coverage
        env:
          MONGO_URI: mongodb://localhost:27017/ntrb-test
          # Lets Jest's sandbox run the MongoDB driver's dynamic import('os').
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    name: Docker image, smoke test, CVE scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build api

      - name: Start stack and wait for health checks
        run: |
          cp .env.sample .env
          docker compose up -d --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/docs/
          curl -fsS -X POST http://localhost:3000/auth/signup -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"password123","firstName":"Smoke"}'
          curl -fsS -X POST http://localhost:3000/auth/signin -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"password123"}' | grep -q accessToken

      - name: Graceful shutdown exits 0
        run: |
          docker compose stop -t 15 api
          test "$(docker compose ps -a api --format '{{.ExitCode}}')" = "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Trivy scan (fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress ntrb-api:local

      - name: Tear down
        if: always()
        run: docker compose down -v
